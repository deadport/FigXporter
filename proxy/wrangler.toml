name = "figma-to-roblox-proxy"
main = "worker.js"
compatibility_date = "2024-09-01"

# KV namespace backing the Figma <-> Studio bridge (/bridge/:code).
# Create it once with:  wrangler kv namespace create BRIDGE
# then paste the returned id below.
[[kv_namespaces]]
binding = "BRIDGE"
id = "REPLACE_WITH_YOUR_BRIDGE_KV_NAMESPACE_ID"
